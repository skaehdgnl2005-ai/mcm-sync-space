# R1 스모크 — 프로바이더 생존성 판정 (05 §3).
#
# 1셀카 × 1상품 × 2모델 × N2 = 4장. 가장 어려운 패턴(비세토스)을 쓴다 —
# 여기서 통과 못 하면 R2를 돌릴 이유가 없다.
#
# 생존 기준: 정책 거부 없이 1장 이상 유의미한 합성. 판정과 별개로 6가지 관찰
# (정책 거부 / 로고 변형 / 다중 이미지 규약 / 종횡비 / 워터마크 / 지연)을 기록한다.
# → G1: 2종 생존이면 R2를 2모델로, 0종이면 컨틴전시 발동.
#
# 셀카: 05 §3 R1의 권장은 smart_daily(s_smart)였으나 **s_casual로 교체**했다.
#   s_smart 실물이 380×1244 — 긴 변은 규격을 넘지만 폭이 380px이라 얼굴이 ~45px다.
#   R1의 1순위 관찰이 "실인물 얼굴 편집 정책 거부"인데, 얼굴이 그만큼 작으면
#   통과가 '정책을 통과한 것'인지 '얼굴로 인식되지 않은 것'인지 구분되지 않는다
#   (= 거짓 통과). 배경도 순백 스튜디오라 c5(원본 배경 유지)가 공짜로 통과한다.
#   s_casual은 686×1536 · 야외 자연광 · 얼굴 선명 = 실사용자 업로드에 가깝다.
#   s_smart는 R2 본 매트릭스에서 포멀도 축으로 그대로 쓰인다(교체 검토는 별건).

exp_id: r1_smoke
models: [gemini_nb, gpt_image]
selfies: [s_casual]
products: [MMRGATA04CO001]
prompt_versions: [pv1]
reps: 2
concurrency: { global: 2, per_model: 1 }   # 스모크는 로그를 순서대로 읽는 편이 낫다
budget_cap_usd: 1
