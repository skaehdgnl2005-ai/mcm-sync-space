# 셀카 레지스트리 — 06 §3.
#
# 포멀도 축이 갈리게 3장 (01 §2). 전부 **동의된 실인물** 사진이며 assets/는 git
# 미추적이다 (06 §1 N4). prep_assets로 긴 변 1536 리사이즈 + EXIF 제거 후 배치한다.
#
# note에는 R2 채점 중 관찰한 조건을 적어 둔다 — 00-common §7.2(사용자 사진 스펙)
# 기입값의 근거가 되는 메모다 (05 §1 산출물 1).

s_casual:
  file: assets/selfies/s_casual.jpg
  formality: casual
  note: >-
    686×1536 (원본 766×1714에서 긴 변 1536 리사이즈, EXIF 4태그 제거).
    전신·정면·직립, 야외 콘크리트 벽 기대선 자세, 흐린 날 자연광(균일·부드러운 그림자),
    얼굴 선명. 셋 중 유일하게 실제 배경이 있어 c5(원본 배경 유지) 판정이 유의미하다.
    **R1 스모크 기준 셀카** (05의 s_smart 권장에서 교체 — r1_smoke.yaml 주석 참고).

s_smart:
  file: assets/selfies/s_smart.jpg
  formality: smart_daily
  note: >-
    1229×1536 (원본 1440×1800에서 긴 변 1536 리사이즈). **R2 착수 직전 교체분** —
    구 자산(380×1244·순백 배경, `_originals/selfies/s_smart.png`)은 얼굴 ~45px라
    c1·c4의 상한이 입력 해상도에 걸리고 c5가 공짜 통과였다. R1은 s_casual로
    돌렸으므로 교체로 잃은 연속성은 없다.
    전신·직립, 드레스셔츠+슬랙스+스니커즈, 베이지 배경 + 나무 캐비닛(실배경 →
    c5 판정 유효), 균일 스튜디오광, 얼굴 폭 ~155px.
    ⚠ **팔짱 + 몸 좌측이 캐비닛에 가림** — pv1의 cross/shoulder 지시("스트랩은
    연속적이며 팔 뒤로 지난다")의 최난도 케이스다. 두 모델에 동일 입력이라 승자
    비교는 공정하나, 이 행이 무너지면 원인은 포멀도가 아니라 **포즈**다 →
    00-common §7.2의 사진 조건(팔짱·가림 비권장) 근거로 쓸 것.
    ⚠ 얼굴 3/4 측면 + 머리 상단이 프레임에 잘림. s_casual·s_formal(정면)과 달라
    포멀도 축에 포즈 축이 섞여 있다.
    ⚠ 스튜디오 룩북성 촬영물 — 실사용자 셀카 대비 05 §7 리스크 1(정책 거부)이
    낙관적으로 측정될 수 있다. §7.2 기입 시 이 편향을 감안할 것.

s_formal:
  file: assets/selfies/s_formal.jpg
  formality: formal
  note: >-
    866×1496 (업스케일 없음). 정면·직립이나 **허벅지 위에서 크롭** — 05 부록 B §7.2
    초안의 "무릎 위 이상"보다 타이트하다. 밝은 회색 스튜디오 배경, 균일광, 얼굴 선명.
    hip 위치 제품(cross/shoulder)은 크롭 경계에 걸리고 back(백팩)은 판정이 어렵다.
