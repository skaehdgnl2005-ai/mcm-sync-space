# R7 — gemini 레퍼런스 장수 축. **주모델 전환의 관문 실험.**
#
# 배경: 라이브 주모델을 gpt_image → gemini_nb로 전환하기로 했다(속도·계약 여유·글루 단순화).
#   gpt는 사전 생성 전용으로 남는다(크레딧 $100 소진 · 1.77MP · shoulder 5/6).
#   그런데 gemini의 실측은 **전부 ref 1장**이고, 배포 설정은 §7.1상 **ref 2장**이다.
#
# 왜 shoulder 단일 위치인가: gemini의 약점이 정확히 거기다.
#   R2 동일 조건(ref1) 위치별 — back 5/6 · cross 5/6 · **shoulder 2/6** (gpt는 5/6).
#   back·cross는 ref1에서 이미 충분하므로 이 실험은 **가장 약한 칸 하나**에 물량을 몰아준다.
#
# 왜 ref1 팔을 같은 세션에서 다시 도는가: R2는 08-16이다. 세션을 건너뛴 비교로
#   이 프로젝트는 두 번 데었다 — 가설 철회(부록 A-10 ④)와 회선 오인(A-11).
#   대조군을 같은 세션에 두면 그 위험이 0이고, 덤으로 R2의 2/6이 재현되는지도 본다.
#
# 셀카 3종을 유지하는 이유: §A-15 ②가 shoulder의 성공률을 가르는 것은 위치가 아니라
#   **프레이밍**임을 밝혔다(전신 0.80 vs 허벅지 위 크롭 0.30). 셀카를 줄이면 그 교란이 그대로 들어온다.

# ── 성공 판정선 (실행 전 확정 — 결과를 보고 고치지 않는다) ──────────────────────
#   채택(max_ref_images=2) = shoulder 전항목 pass가 **ref1 대비 회귀 없음** (ref2 ≥ ref1)
#   기각 = ref2 < ref1  → gemini만 max_ref_images=1로 배포하고, §7.1과 갈라지는 사유를 부록 A에 남긴다
#   ★ 동수(예: 2/6 vs 2/6)면 **ref2 채택**한다. 근거: 배포 현실에서 B는 URL 2개를 보내며
#     **한 장을 버리는 쪽이 능동적 선택**이라 정당화를 필요로 한다. 게다가 §7.1이 스트랩 컷을
#     필수로 요구하는 이상, 엔진이 그걸 안 읽으면 스펙과 구현이 갈라진다.
#     (A-5 ③의 "baseline 유지" 규율과 방향이 다른데, 여기서 baseline은 gemini의 ref1이 아니라
#      **시스템 스펙 §7.1**이라고 본다. 이 해석을 실행 전에 못 박아 둔다.)
#   ⚠ n=6/팔이다. 자릿수로 읽고, 이 실험으로 "gemini shoulder가 좋다/나쁘다"를 확정하지 않는다.
#     묻는 것은 단 하나 — **레퍼런스를 한 장 더 주면 나빠지는가**다.

# ══ 실행 결과 (2026-08-19, 사후 기록 — 위 사전등록 블록은 한 글자도 고치지 않았다) ══
#   12/12 ok · $1.08. 전항목 pass **ref1 4/6 vs ref2 4/6 — 동수**.
#   → 사전 확정 규칙(동수 → ref2 채택) 적용. **라이브 엔진 max_ref_images = 2 확정.**
#   지연 페널티 없음(p50 16.0 vs 16.5s). 플레이트 각인 재현은 ref2 우세.
#   ★ 대조군이 결정적이었다: 같은 ref1 설정이 R2(08-16) 2/6 → R7 4/6으로 갈렸다.
#     대조군 없이 R2와 비교했다면 "ref2가 shoulder를 2배로 고쳤다"고 오판했을 것이다.
#   상세: 05-gen-research-plan.md 부록 A-17 ②③.

exp_id: r7_gemini_ref
models: [gemini_nb, gemini_ref2]      # gemini_nb = ref1 대조군
selfies: [s_casual, s_smart, s_formal]
products: [MMPGADC01BK001]            # No.08 쇼퍼 — shoulder
prompt_versions: [pv1]
reps: 2
concurrency: { global: 2, per_model: 1 }   # 모델 2개 × 1 = 실효 2 (R2와 같은 부하)
budget_cap_usd: 1.3                        # 견적 1.08
timeout_s: 60                              # gemini p95 18.4s — 넉넉하다
