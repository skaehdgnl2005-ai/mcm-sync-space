# S4b — 난도 셀. s4a와 같은 4팔을 **저해상도 입력**에 걸어 본다.
#
# 두 가지를 동시에 잰다:
#   1) 설정 팔 간의 차이 — s4a의 표준 셀은 R2에서 9/9 전항목 pass였다(천장 효과).
#      천장에서는 어떤 설정이 나은지 보이지 않는다. **바닥을 낮춰야 순위가 드러난다.**
#      R2c가 같은 문제로 "체크리스트로는 안 잡히는 개선"이라는 결론밖에 못 낸 그 지점이다.
#   2) 00-common §7.2의 최소 해상도 규격 — 이쪽이 더 중요할 수 있다.
#
# §7.2 반례 가설 (이 config의 존재 이유):
#   s_smart_lowres는 380×1244다. **긴 변 1244px ≥ 1024px이므로 §7.2를 통과한다.**
#   그런데 폭이 380px이라 얼굴이 ~45px다. 즉 §7.2가 규격으로 삼은 '긴 변'은
#   c1(로고)·c4(인물 보존)의 상한을 전혀 통제하지 못한다는 가설이고,
#   여기서 fail이 나오면 §7.2를 **짧은 변 하한**으로 고칠 실측 근거가 생긴다.
#   `prep_assets.MIN_SHORT_EDGE_WARN = 768`은 이미 코드에 있으나 §7.2에는 없다 —
#   코드가 문서보다 앞서 있는 상태를 데이터로 정렬한다.
#
#   ★ 부록 A-1이 명시한 공백이 정확히 이것이다: R2는 fail 0건이라 "§4의 fail마다 note
#     한 줄" 의무가 발동하지 않았고, 그래서 **§7 스펙을 강화할 관측 근거가 없다.**
#     fail을 만들어 낼 수 있는 셀이 지금 우리에게 이것 하나뿐이다.
#
# ⚠ 이 셀이 검증하지 **못하는** 것 (과대 해석 금지):
#   - c5(원본 배경 유지): 배경이 순백이라 공짜 통과다. 이 셀로 c5를 논하지 말 것.
#   - §7.2 금기 3종 중 **역광·극단 각도·얼굴 가림은 여전히 미검증**이다. 자산이 없다.
#     이 config는 금기 3종이 아니라 **해상도 하한** 한 축만 건드린다.
#
# SKU를 비세토스(MMRGATA04CO001) 하나로 좁힌 이유: R1이 "가장 어려운 패턴 재현"으로
#   지목한 SKU다. 저해상도 × 최난도 패턴 = c1이 무너진다면 여기서 무너진다.

exp_id: s4b_hardcell
models: [gpt_base, gpt_s912, gpt_n2]       # gpt_fid는 파라미터 미지원으로 사장 — s4a 주석 참고
selfies: [s_smart_lowres]
products: [MMRGATA04CO001]
prompt_versions: [pv1]
reps: 2
concurrency: { global: 2, per_model: 1 }   # s4a와 동일 — 지연을 나란히 비교하려면 부하가 같아야 한다
budget_cap_usd: 0.8                        # 견적 0.64 (6 호출, gpt_n2만 2장분 과금)
timeout_s: 90
