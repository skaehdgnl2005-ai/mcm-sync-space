# R8 — 라이브 엔진 정면 대조. **같은 세션·같은 채점자로 두 벤더를 나란히 놓는 첫 실험.**
#
# 배경: §A-17 ①이 라이브 = `gemini_nb` / 사전 생성 = `gpt_image`로 역할을 갈랐다.
#   근거는 지연 4배(p95 16.4s vs 58.3s · 60초 계약 여유 43.6s vs 1.7s)이고 그 부분은 충분히 잼혔다.
#   **남은 구멍이 정확히 두 개다:**
#
#   (1) **gemini는 제품이 아니라 사람에서 실패한다.** c4(인물 보존) 75%(n=12) vs gpt 96%(n=24) —
#       §A-17 ⑤. 관측된 실패는 넥타이 색 아이보리→베이지 / 자세 전면 변경(팔짱→캐비닛에 팔 걸침) /
#       손 위치 변경이다. 이 서비스의 가치 명제가 "이게 나야"이므로 **인물 변형은 제품 오류보다
#       치명적**이다. 위험의 *종류*가 다르다 — gpt는 가방에서 틀리고 gemini는 사람에서 틀린다.
#
#   (2) **"품질은 무차별"이라는 결론이 세션 간 풀링에 기대고 있다.** shoulder gemini 0.50(n=12)
#       vs gpt 0.55(n=20)인데 서로 다른 날·다른 실험을 합친 값이다(§A-17 ④).
#       **같은 세션 정면 비교가 이 프로젝트에 한 번도 없었다.**
#
# 왜 대조군(gpt 18장)을 아끼지 않는가: OpenAI 크레딧 $100 중 $88.72가 남아 **gpt 생성은 자비 0**이다.
#   지금까지 벤더 비교는 전부 세션을 건너뛴 것이었고 그래서 세 번 데었다
#   (§A-10 ④ 가설 철회 · §A-11 회선 오인 · §A-17 ③ ref2 오판 직전 회피).
#   **대조군은 아끼지 말고 gemini 장수만 아낀다** — 같은 세션·같은 채점자 정면 비교를
#   **gemini 값(자비 $1.62)만 내고** 얻는다.
#
# 왜 이 매트릭스인가: 3셀카 × 3상품(cross·back·shoulder) × N2 = **R2와 정확히 같은 모양**인데
#   **ref 장수만 1 → 2**다. 즉 배포 설정에서의 재측정이자 정면 비교다.
#   두 모델 모두 `max_ref_images: 2` = §7.1 배포 설정이며 **완전히 같은 입력**을 받는다.
#   `MMRGATA04CO001_R6`은 보조컷이 웨빙 스트랩 클로즈업인 별 키다(§A-14 ③).
#
# 답하지 않을 것: 지연(이미 충분히 잼) · 프롬프트 개선(pv2=pv1 동결 §A-13 ⑦) · N 정책(§A-17 ⑥ 확정).

# ── 사전 확정 판정선 (실행 전 확정 — 결과를 보고 고치지 않는다 · §A-5) ──────────────
#
#   주 판정 (c4 · 인물 보존) — 벤더 결정을 뒤집을 수 있는 유일한 관측
#     유지          = gemini c4 fail ≤ 3/18  (통과율 ≥ 83%)
#     에스컬레이션  = 4건 이상
#     ★ **같은 세션 gpt의 c4를 반드시 함께 본다.** gpt도 동시에 나빠졌다면 원인은 벤더가 아니라
#       채점자·세션이다. **그 경우 판정을 보류한다.** (이 절이 세션 드리프트에 대한 유일한 방어다.)
#
#   부 판정 (셀 통과 · best-of-N)
#     gemini 셀 통과 ≥ 6/9 (05 §5의 GO 문턱). 미만이면 **벤더 역할 분담 자체를 재검토 대상**으로 올린다.
#
#   에스컬레이션 경로 (지금 미리 정한다 — 나중에 즉흥으로 만들지 말 것)
#     c4 미달 시 →
#      (i) pv2에 pose 보존 **문장 1개**만 추가하는 축 실험을 **별도 사전등록**으로.
#          ★ 문단이 아니라 문장 단위로 자른다 (§A-10 ②: pv1c가 문단을 갈아서 실패했다)
#          ★ pv1 원문은 한 글자도 건드리지 말고 **문자열 연결**로 만든다 (pv1d 방식)
#      (ii) 그래도 안 되면 라이브를 gpt로 되돌리고 60초 계약은 폴백에 맡긴다 (§A-13 ③)
#
#   관측 항목 (**판정선 없음 — 기록만**)
#     No.09 gemini 6장 중 스트랩이 직조 웨빙으로 렌더된 수. gpt는 같은 조건에서 1/8이었다(§A-14 ③).
#     **n=6이라 판정 불가다. 판정선을 걸지 말 것.**
#
#   ⚠ 팔당 18장이다. 자릿수로 읽어라(05 §9). 묻는 것은 **"gemini의 c4가 실서비스에 쓸 수준인가"**
#     하나이고, 나머지는 같은 값에 딸려 오는 덤이다.

# ══ 실행 결과 (2026-08-19, 사후 기록 — 위 사전등록 블록은 한 글자도 고치지 않았다) ══
#   36/36 ok · $3.06 (gemini $1.62 자비 + gpt $1.44 크레딧) · refused 0 · error 0 · timeout 0.
#
#   ★ 주 판정 (c4) = **유지.** gemini **17/18 (94%)** — 사전선 fail ≤ 3 충족(fail 1건).
#     같은 세션 gpt 대조군도 **17/18 (94%)** 로 열화가 없다 → **보류 조항 미발동.**
#     ⇒ 세션 간 풀링이 만든 격차(gemini 75% vs gpt 96%, 21%p)가 **같은 세션에서 0%p로 사라졌다.**
#        §A-17 ⑤의 "gemini는 사람에서 실패한다"는 리스크를 **철회**한다.
#     ⇒ 두 벤더의 c4 실패 1건이 **같은 칸(s_formal × shoulder)** 에서 났다 — 자세 임의 변경.
#        c4는 (벤더)가 아니라 **(셀카 프레이밍 × wear_position)** 의 함수다.
#
#   부 판정 (셀 통과) = **충족.** gemini **7/9** ≥ 6/9. (gpt 6/9)
#     전항목 pass 13/18 vs 11/18. 항목별은 무차별이 아니다 — c1 gemini 89% vs **gpt 61%**,
#     반면 c3·c5·c6은 gpt가 18/18 완벽. 실패가 서로 다른 항목에 몰린다.
#
#   관측 (판정 아님) — No.09 웨빙 스트랩: **gemini 6/6** vs gpt 1/6 (R6 gpt는 1/8).
#     같은 레퍼런스인데 갈렸다 → 재질 한계는 레퍼런스가 아니라 gpt 쪽일 수 있다.
#     **n=6이므로 사전등록대로 판정하지 않는다.**
#
#   에스컬레이션 (i)(ii) 모두 **미발동**. 라이브 = gemini_nb · max_ref_images = 2 **불변**.
#   ⚠ 채점자가 Dev A가 아니다(에이전트). R8 내부 비교는 유효하나 R6·R7과 나란히 놓지 말 것.
#   상세: 05-gen-research-plan.md 부록 A-18.

exp_id: r8_live_headtohead
models: [gemini_ref2, gpt_base]        # 둘 다 max_ref_images=2 = 배포 설정
selfies: [s_casual, s_smart, s_formal]
products: [MMRGATA04CO001_R6, MMKGATA03MT001, MMPGADC01BK001]   # cross · back · shoulder
prompt_versions: [pv1]
reps: 2
concurrency: { global: 2, per_model: 1 }   # 모델 2개 × 1 = 실효 2 (R2·R7과 같은 부하)
budget_cap_usd: 3.50                       # 견적 3.06 (gemini 1.62 자비 + gpt 1.44 크레딧)
timeout_s: 120                             # gpt는 p50 ~51s다. 90s로 자르면 timeout이 섞인다(§A-14 ①)
