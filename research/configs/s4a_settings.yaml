# S4a — 설정 최적화 4팔 1:1. R3(프롬프트) 착수 **전**에 도는 이유가 있다.
#
# 목적: "60초 계약(00-common §5 폴링 규약) 안에서 품질 최대"인 설정 조합 1개를 골라
#   R5 실엔진에 이관한다. 승자 모델은 스폰서 제약으로 확정됐으므로(부록 A) 여기서
#   비교하는 것은 **모델이 아니라 설정**이다.
#
# 왜 R3보다 먼저인가: 남은 최대 리스크가 품질이 아니라 **60초 계약의 여유 3.8초**이고
#   (부록 A-2), 그 여유를 실제로 움직일 수 있는 노브는 프롬프트가 아니라 size·N이다.
#   또 R3의 프롬프트 축들은 여기서 정해진 설정 위에서 돌아야 두 번 돌지 않는다.
#
# 통제: 4팔 전부 model_id·quality·pv1·ref 2장이 동일하고 **한 팔당 한 파라미터만** 다르다.
#   style_hints 미사용 — lighting 유/무는 R3 축④의 비교 대상이라 여기서 섞으면
#   그 비교의 기준선이 사라진다 (r2_bakeoff.yaml과 같은 이유).
#
# 셀: s_casual × 3 SKU = r2c와 **동일한 셀 집합**이다. 의도적이다 —
#   s_casual은 셋 중 유일하게 실배경이 있어 c5 판정이 유의미하고, r2c(gpt_ref2 6장)가
#   gpt_base의 세션 간 재현 대조군이 된다. 난도 셀은 s4b_hardcell.yaml로 분리했다
#   (러너가 곱집합만 전개하므로 셀카를 추가하면 SKU 3종에 전부 곱해진다).
#
# ⚠ 견적: gpt_n2는 호출당 2장 과금이라 단가를 0.16으로 못 박았다 (models.yaml 참고).
#   24 호출 = 30장분 과금 ≈ $2.40. "24장 ≈ $1.9"라는 어림값보다 비싼 것은 이 때문이다.

# ★ 착수 시 4팔 → **3팔**로 축소됐다. gpt_fid(input_fidelity 명시)는 실행 전 1콜 프로브에서
#   400 invalid_input_fidelity_model로 **파라미터 미지원** 확정 (models.yaml 해당 항목 참고).
#   프로브가 없었다면 이 400이 6셀 × 2회 재시도 = 12행의 error로 쌓여 거부+오류율 게이트를
#   우리 설정 오류로 때렸을 것이다. manifest의 gpt_fid error 2행은 **음성 결과의 기록**이라
#   지우지 않는다 (status != ok라 재개·집계에 영향 없음).

exp_id: s4a_settings
models: [gpt_base, gpt_s912, gpt_n2]
selfies: [s_casual]
products: [MMRGATA04CO001, MMPGADC01BK001, MMKGATA03MT001]
prompt_versions: [pv1]
reps: 2
concurrency: { global: 2, per_model: 1 }   # gpt 총 동시 호출 2 = R2·R2c에서의 실효 동시성.
                                           #   지연을 R2와 비교하려면 **부하도 같아야 한다** —
                                           #   4 동시로 올리면 측정값이 429·큐잉과 섞인다.
budget_cap_usd: 2.2                        # 견적 1.92 바로 위. 느슨하게 잡으면 가드가 아니다.
timeout_s: 90                              # r2_bakeoff와 동일 근거 — 측정을 우리 컷오프로 절단하지 않는다.
