# R2c — 레퍼런스 장수 축 (R3 축①을 S3로 앞당김). 05 부록 B §7.1 확정 전 검증.
#
# 목적: 00-common §7.1의 "정면 1장 필수 + 3/4 각도 1장 권장"을 그대로 확정해도
#   되는지. 이 문구가 Dev B의 **전 카탈로그 대량 수집 분량**을 결정하므로,
#   틀리면 재수집 비용이 가장 큰 항목이다.
#
# 통제: gpt_ref1 / gpt_ref2는 model_id·quality·size가 동일하고 **레퍼런스 장수만**
#   다르다 (07 §4 "축별 독립 1:1, full factorial 금지"). pv1 동결 유지.
#   ref1은 동시에 R2 조건의 같은-세션 재현이라, R2와의 시점 차이를 대조로 흡수한다.
#
# ⚠ 관측 한계: R2 채점이 gpt 9/9 전항목 pass였다. 천장 효과 때문에 이 실험은
#   **개선을 증명할 수 없고, 회귀(2번컷이 오히려 해치는가)와 중립성만 판정한다.**
#   그것으로 충분한 이유는, §7.1이 답해야 하는 질문이 "2장이 더 좋은가"가 아니라
#   "B에게 2장을 모으게 할 가치가 있는가"이기 때문이다.
#
# ⚠ 2번컷은 SKU마다 종류가 다르다 — 쇼퍼=사선 3/4 / 크로스=탑다운 / 백팩=후면 등판.
#   그래서 이 실험은 "3/4 각도"가 아니라 "보조컷 1장"의 검증이며, 결과를 §7.1
#   문구에 반영할 때 그 일반화 수준을 그대로 써야 한다. 특히 백팩은 정면 팩샷에
#   어깨 스트랩이 보이지 않아, c3("back인데 스트랩 표현조차 없음") 관점에서
#   후면컷이 3/4보다 유효한 보조컷이라는 가설이 여기서 검증된다.
#
# 자산 주의: 크로스 2번컷이 578x842로 05 부록 B의 1024 하한 미달이다. 즉 이 실험은
#   "규격 미달 보조컷을 넣어도 안전한가"도 함께 잰다 — §7.1 최소 해상도의 근거.

exp_id: r2c_refcount
models: [gpt_ref1, gpt_ref2]
selfies: [s_casual]              # 실배경 보유 = c5가 유의미한 유일한 셀카, R1 기준 셀카
products: [MMRGATA04CO001, MMPGADC01BK001, MMKGATA03MT001]
prompt_versions: [pv1]
reps: 2
concurrency: { global: 2, per_model: 1 }   # gpt 총 동시 호출 2 = R2에서의 gpt 실효 동시성.
                                           #   ref1 팔이 R2 조건의 재현이 되려면 부하도 같아야
                                           #   하고, 4 동시는 429 위험이 있다 (05 §7 레이트리밋)
budget_cap_usd: 2
timeout_s: 90                    # r2_bakeoff와 동일 근거 — 측정을 컷오프로 절단하지 않는다
