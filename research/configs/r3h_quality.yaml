# R3 축⑤ — 품질 티어 mid vs high. **cross 실패 셀에서 돌려 두 질문에 동시에 답한다.**
#
# 질문 1 (축⑤ 본래): high가 mid보다 나은가, 그 대가(단가 ~2.5배 · 지연 증가)를 치를 만한가.
# 질문 2 (cross 결함): 스트랩은 **얇은 구조물**이다. 품질 티어가 이를 바꿀 여지가 실재한다.
#   프롬프트는 두 번 실패했고(축⑥ pv1c, 그리고 pv1 자체), **두 벤더가 같은 방식으로**
#   실패한다(부록 A-9 ①) — 지시가 아니라 능력의 문제라는 신호다. 그렇다면 지시를 더
#   다듬는 것보다 **연산량을 올리는 쪽**이 맞는 축이다.
#
# 통제: gpt_base와 gpt_high는 model_id·size·ref 장수·pv가 전부 같고 **quality만** 다르다.
#   셀카는 실패 조건(s_casual) 하나로 좁힌다 — 여기서 안 되면 어디서도 의미 없다.
#   s_smart 대조군을 빼는 이유: 이 실험은 "회귀 감시"가 아니라 "실패 셀 구제 가능성"을
#   묻는다. 회귀 감시는 채택이 유력해진 뒤에 붙여도 늦지 않다(그리고 high는 비싸다).

# ── 성공 판정선 (실행 전 확정) ────────────────────────────────────────────────
#   품질: s_casual에서 gpt_high의 **c3 pass ≥ 2/4** (mid 기준선 1/10 ≈ 10%)
#   ★ 그리고 **지연 게이트를 반드시 함께 본다**:
#     품질이 이겨도 **N=2 병렬 first-ok p95 + I/O 10s > 60s**면 **채택 불가**다.
#     60초 계약의 여유는 이미 얇고(A-10 ①②) high는 출력 토큰이 늘어 느려질 것이 거의 확실하다.
#     "품질 최대"가 아니라 **"60초 계약 안에서 품질 최대"**가 이 연구의 산출물이다(05 §1).
#   두 조건을 다 넘겨야 채택. 품질만 이기면 → **R6 데모 자산 전용**으로 격리 채택을 검토한다
#     (R6는 사전 생성이라 60초 계약의 적용을 받지 않는다 — 라이브 엔진과 분리 가능).

exp_id: r3h_quality
models: [gpt_base, gpt_high]
selfies: [s_casual]
products: [MMRGATA04CO001]
prompt_versions: [pv1]
reps: 4
concurrency: { global: 2, per_model: 1 }   # 모델 2개 × 1 = 실효 동시성 2 (R2·S4a와 같은 부하)
budget_cap_usd: 1.3                        # 견적 1.12 (mid 4×0.08 + high 4×0.20)
timeout_s: 120                             # ⚠ high는 느리다. 90s로 자르면 성공했을 생성이
                                           #   timeout으로 기록되어 축⑤ 판정 자체가 불가능해진다.
                                           #   러너 하드컷은 +5s이므로 실질 125s.
