# R3 축⑥ 재시도 — pv1 vs **pv1d** (최소 델타). **프롬프트 축의 마지막 시도.**
#
# 축⑥ 1차(pv1c)는 기각됐다(부록 A-10 ①). 그러나 그 실패는 두 변경이 한 문단에 섞인
# 탓이 크다: (a) 가림 판정 규칙 추가 + (b) 대각선 문구 약화. (b)가 좌우 결함을 새로
# 만들었고(A-10 ②) (a)까지 같이 죽었다. **(a)는 아직 깨끗이 시험되지 않았다.**
#
# pv1d의 설계 원칙: **pv1 원문을 한 글자도 건드리지 않는다.**
#   prompts.py에서 `WEAR_POSITION_DIRECTIVES["cross"] + _CROSS_GAP_RULE`로 **연결해서**
#   만든다 — 손으로 옮겨 적으면 그 과정에서 문구가 미끄러진다(축⑥이 정확히 그렇게 실패했다).
#   검증됨: pv1 원문 통째 보존 · 'from one shoulder to the opposite hip' 유지 ·
#   기준점 없는 상대어(near/far) 없음 · 절대 좌우(left/right) 없음 · 순수 추가 +171자.
#
# 추가되는 문장은 이것 하나뿐:
#   "Where the arm hangs away from the torso and a gap is visible between them,
#    the strap must be drawn inside that gap — it must not stop or disappear at
#    the edge of the arm."
#
# 셀카 2종의 역할 (r3f와 동일):
#   s_casual = 실패 조건 (정면·직립·팔 내림, 팔–몸통 틈 있음). 현행 c3 1/10.
#   s_smart  = 회귀 대조군 (팔짱, 틈 없음). pv1 기준 **4/4**. pv1c는 여기서 2/4로 무너졌다.

# ── 성공 판정선 (실행 전 확정 — 결과를 보고 고치지 않는다) ──────────────────────
#   채택 = s_casual에서 pv1d의 **c3 pass ≥ 2/4**  AND  s_smart에서 **4/4 유지**
#   기각 = 위 둘 중 하나라도 미달
#   ★ 정지 규칙 (부록 A-10 ⑥): **기각이면 cross에 대한 프롬프트 시도를 종료한다.**
#     §7.2 자세 조건(스코프 축소)으로 이행하고, 문구를 더 바꾸지 않는다.
#     pv1은 이미 연속성·팔 뒤 통과·대각선을 전부 명시하고도 실패했고, gpt와 gemini가
#     같은 방식으로 실패한다 — 지시 부족이 아니라 모델 능력의 한계라는 뜻이다.

# ══ 실행 결과 (2026-08-18, 사후 기록 — 위 사전등록 블록은 한 글자도 고치지 않았다) ══
#   회선 열화(부록 A-11) 중에 실행되어 **양 팔 모두 표본 결손**: s_casual 2v2 · s_smart 3v3.
#   분모가 4가 아니므로 판정선의 성립 여부를 말할 수 없다 → **미판정**.
#   미판정은 채택이 아니므로 **위 정지 규칙이 발동**한다 → cross 프롬프트 축 종결,
#   산출물 ④는 pv2 = pv1(변경 0)로 동결. **이 config는 재실행하지 않는다.**
#   상세: 05-gen-research-plan.md 부록 A-13 ⑤.
#   부수 발견: ok 10장 전부에서 스트랩 재질 위조(웨빙→민가죽) → 00-common §7.1 재개정(A-13 ⑧).

exp_id: r3g_cross_pv1d
models: [gpt_base]
selfies: [s_casual, s_smart]
products: [MMRGATA04CO001]
prompt_versions: [pv1, pv1d]
reps: 4
concurrency: { global: 2, per_model: 2 }   # 모델 엔트리 1개 → per_model도 2여야 실효 동시성 2
budget_cap_usd: 1.5                        # 견적 1.28
timeout_s: 90
