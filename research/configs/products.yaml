# --- 밀라노 에디션 잔여 가방 SKU (2026-08-18 수집) --------------------------------
# 출처: MCM 공식몰(kr.mcmworldwide.com) PDP 팩샷을 Playwright로 클립 스크린샷.
#   수집 규격은 00-common §7.1 — 화이트/뉴트럴 팩샷 · 정면 1장 필수(긴 변 ≥1024) ·
#   스트랩 카테고리(cross·shoulder·back)는 **스트랩 선명 컷 1장 필수** · 모델 착용컷 금지.
#   갤러리 각도 ID(_01·_04·_05 …)와 원본 URL은 각 SKU 주석에 남긴다. 착용컷(_09~_11)은
#   전부 제외했다.
#
# **프레이밍**: 공식몰 마스터는 4000px 캔버스에 제품이 11~43%만 차지한다. 그대로 쓰면
#   prep_assets의 긴 변 1536 축소 후 제품 실효 해상도가 기존 4종(1379~1466px)의 절반까지
#   떨어져 c1(패턴·로고·하드웨어) 판정이 입력 해상도 때문에 불리해진다. 그래서 브라우저
#   안에서 제품 바운딩 박스를 구해 **여백 6%로 클립**했다 — 채움 75~100%로 기존 4종의
#   관례(75~90%)와 맞춘다. 확대(업스케일)는 하지 않았다.
#
# name·material·color_hardware는 위 4종과 같은 규율로 **xlsx 원문 그대로**다.
#
# ✅ 2026-08-19 정정 — 위에 있던 "No.02·No.05 제품명은 공식몰과 다르지만 임의 수정하지 않고
#   원문을 유지한다"는 보류 지시는 **해제**됐다. 라이브 전수 대조 결과 밀라노 시트는 2건이
#   아니라 **12/12 전부** PDP 제목과 달랐고(도쿄·파리·뮌헨은 36/36 일치), 원인은 PDP `title`이
#   아니라 **`meta[name=description]` 후반 태그라인을 압축**한 것으로 특정됐다. 결정적 증거는
#   xlsx `오버롤`이 title의 `오버올`이 아니라 meta의 `오버롤`과 일치한다는 점이다.
#   → xlsx의 밀라노 `공식 제품명` 12건을 PDP 제목(말미 컬러 토큰 제거)으로 교체했고, 이 파일의
#     `name`도 같은 값으로 맞췄다. 즉 "xlsx 원문 그대로"라는 이 파일의 불변조건은 유지된다.
#
# ⚠ 반대로 **`MWRGATA05BK001`(No.05)의 `color_hardware`는 절대 고치지 말 것.**
#   한국 PDP 스펙 불릿은 `24K 골드 도금 브라스 하드웨어`라고 쓰지만 **그 줄이 사이트 오류**다:
#     · en_JP 동일 SKU  = `Silver-tone cobalt brass hardware`
#     · 꼬냑 형제 MWRGATA05CO001 = `24k gold-plated brass` → 블랙 PDP가 꼬냑 카피를 오배치
#     · 제품 사진 HSV 정량(같은 부위 클래스프): 이 SKU 골드비율 0.0000 vs 실제 골드
#       MWRGATA01BK001 0.3070. 배경 R−B가 양쪽 0.0000이라 웜 캐스트 탓도 아니다.
#   현재 값 `블랙, 실버톤 브라스`가 **맞다**. 08-notice §3 ① 및 00-common §9의
#   "심각·우선 수정" 지시는 근거가 이 잘못된 PDP 한 줄이었으므로 따르면 안 된다.

