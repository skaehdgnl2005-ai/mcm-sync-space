# 상품 레지스트리 — **계약 필드명 그대로** (06 §3).
#
# 키 = SKU, 값의 필드명은 services/gen/app/schemas.py의 Product와 1:1이다.
# 연구에서는 이 항목이, 실엔진에서는 payload.product.model_dump()가 **같은 형태**로
# prompts.assemble()에 들어간다 → 승격 시 프롬프트 조립기 무수정 (06 §8).
#
# name·material·color_hardware는 `MCM 제품 세부 데이터.xlsx`
# ('밀라노 에디션 제품 메타데이터' 시트)의 **원문 그대로**다. slug 변환·요약·번역
# 금지 (01 §4 v2). 이 원문의 정확도가 c1(패턴·로고·하드웨어 톤 일치) 판정에 직결된다.
#
# ref_images: 공식몰 팩샷. 정면 1장 필수, 3/4 각도 1장 권장, 상한 3장 (05 부록 B §7.1).
#   R2는 4 SKU 장수를 통일할 것 — 한 SKU만 레퍼런스가 많으면 그게 교란 변수가 된다.
#   장수 비교는 R3 축①에서 models.yaml의 max_ref_images 변형으로 한다.
#
# size: **계약에 없는 유일한 필드**다 (schemas.py의 Product에는 없다).
#   c2("DB 사이즈 대비 명백한 과대·과소")를 사람이 판정할 때 보라고 갤러리에만 띄운다.
#   프롬프트에는 들어가지 않는다 — 실엔진 payload에 없는 정보를 연구에서만 주면
#   R2 판정이 실서비스보다 낙관적으로 나온다. 넣을 가치는 R3에서 따로 검증한다.

