  color_hardware: "블랙, 24K 골드 도금 브라스 플레이트"
  wear_position: shoulder      # DB ⑦ 합성 위치 = #어깨_착용, #손_파지 → 베이크오프는 shoulder로 고정
  ref_images:                  # 1 = 정면 / 2 = 사선 3/4 (972x1286)
    - assets/products/MMPGADC01BK001/1.jpg
    - assets/products/MMPGADC01BK001/2.jpg
  size: "약 15 × 45 × 36 cm, 핸들 스트랩 드롭: 22 cm"   # 계약 밖 (위 주석 참고)

