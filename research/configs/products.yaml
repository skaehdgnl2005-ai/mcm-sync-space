# 하나뿐이다: 05 부록 A-12가 `r3g_cross_pv1d`·`r3h_quality`의 **--resume 재개를 계획**하고
# 있는데, 위 MMRGATA04CO001의 ref 목록을 제자리에서 고치면 재개분이 기존 10장과 다른
# 레퍼런스로 생성되어 그 실험의 통제가 조용히 깨진다. 별 키면 그 위험이 0이다.
#
# 차이: 보조컷을 2.jpg(탑다운 — 스트랩이 안 보인다) → **3.jpg(웨빙 스트랩 클로즈업)**으로 교체.
#   `id` 필드는 contract_dict()에서 이 키가 그대로 들어가지만 **프롬프트에는 쓰이지 않는다**
#   (prompts._product_facts는 name/material/color_hardware만 읽는다). 즉 생성 조건은
#   MMRGATA04CO001과 레퍼런스 1장 말고는 완전히 동일하다.
#
# 근거 (05 부록 A-13): r3f·r3g의 cross 산출물에서 스트랩이 **전부 민가죽으로 위조**됐다.
#   실물은 헤링본 웨빙(코냑)이다. 정면 팩샷(1.jpg)에 웨빙이 보이기는 하나 가방에 가려 짧게
#   끊긴 구간뿐이라 모델이 근거로 삼지 못했다. `back`에서 같은 실패(스트랩 색 지어내기)가
#   후면 등판컷 한 장으로 1/6 → 4/4로 뒤집힌 선례(A-9 ②)를 그대로 적용한 것이다.
MMRGATA04CO001_R6:
  name: "S Aren 비세토스 크로스바디"
  category: 크로스바디백
  material: "비세토스 모노그램 캔버스, 나파 가죽 트림, 패브릭 웨빙 스트랩, 코튼 트윌 안감"
  color_hardware: "꼬냑, 24K 골드 도금 브라스 플레이트"
  wear_position: cross
  ref_images:                  # 1 = 정면(필수) / 3 = 웨빙 스트랩·숄더패드·스냅훅 클로즈업
    - assets/products/MMRGATA04CO001/1.jpg
    - assets/products/MMRGATA04CO001/3.jpg
  size: "약 7 × 27 × 21 cm, 스트랩 길이: 85~151.5 cm"   # 계약 밖

# --- 도쿄·파리·뮌헨 에디션 페르소나 SKU (2026-08-19 · A 선행 큐레이션) ------------
# 00-common §9 미결③(팀원 에디션 데이터 미도착)을 A가 선행 큐레이션으로 해소한 결과다.
# name·category·material·color_hardware·size는 `MCM 제품 세부 데이터.xlsx`의 신규 시트
#   (도쿄/파리/뮌헨 에디션 제품 메타데이터) **원문 그대로**이고, 그 시트는 전부
#   kr.mcmworldwide.com PDP 원문에서 기계 변환해 만들었다 (밀라노 시트처럼 사람이 옮겨
#   적은 값이 아니다 — 라인명 오기 재발 방지).
# ⚠ 팀원 데이터가 나중에 도착하면 그쪽이 원본이 되고 이 항목은 병합/대체 대상이다.
#
# 팩샷: 메모리 mcm-packshot-collection 절차 그대로 — search?q={SKU} 302 → 4000px 마스터 →
#   배경 rgb(247,247,247) 바운딩박스 → 여백 6% 클립 → prep_assets(긴 변 1536·EXIF 제거·q95).
#   착용컷(_09~_11)은 전부 제외. 채움 80~94%로 기존 관례(75~100%)와 맞다.

# p4 (tokyo+commute+mono) — L Aren 비세토스 N/S 토트
#   1 = 정면(_01) — 패브릭 웨빙 스트랩 **전장**이 프레임 안에 있고 스냅훅·실버 슬라이더 버클·
#     조직 텍스처까지 4000px에서 판독된다. shoulder 스트랩 필수컷을 정면컷이 겸한다
#     (No.09가 실패한 조건 '스트랩이 프레임 가장자리에서 잘림'과 정반대).
#   2 = 후면(_04) — 비세토스 패턴 대면적 + 스트랩 부착 스냅훅.
#   ⚠ 이 SKU 갤러리에는 웨빙 **클로즈업 컷이 없다**(_01~_04 + 착용컷뿐). §7.1 ⚠ 실효 검증대로
#     웨빙 '재질·직조'는 레퍼런스로 완전히 고쳐지지 않는다 — N-best 물량 + 사람 선별 전제.
