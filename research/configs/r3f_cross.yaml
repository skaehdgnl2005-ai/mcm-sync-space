# R3 축⑥ — cross 스트랩 배치 지시 (pv1 vs pv1c). **R3의 0순위 축** (05 §3).
#
# 왜 다른 모든 축보다 먼저인가 (05 부록 A-9 ①):
#   gpt 40장 기준 cross 전항목 pass가 5/18(28%)이고, 실패가 **정면·직립·팔 내림 자세**에
#   몰려 있다(s_casual 1/8 · s_smart_lowres 0/6 vs s_formal 2/2 · s_smart 2/2).
#   그리고 **간판 페르소나 p1의 확정 SKU가 이 cross 백(No.09)**이다 — 이 축이 R6 자산
#   확보 비용을 직접 결정한다.
#
# 겨누는 결함 (두 벤더가 동일하게 실패 — 모델 문제가 아니라 지시 문제일 가능성):
#   gpt    "팔과 몸통 사이에서 끝나야 어색하지 않음" / "팔과 몸통의 경계를 잘못 본듯"
#   gemini "팔과 몸 사이에 공간이 있으면 뒤에 스트랩이 살짝 보여야 자연스러운데, 이 표현이 없음"
#   → 팔–몸통 틈으로 보여야 할 스트랩 구간을 그리지 못한다.
#
# 가설: pv1의 `pass behind the arm`이 **"팔 뒤에 가려진다"로 읽혀 그 구간을 생략**하게 만든다.
#   pv1c는 경로 지시("뒤로 지나가라")를 버리고 **가림 판정 규칙**으로 바꾼다 —
#   팔이 몸통을 덮는 곳에서만 가리고, 틈이 있으면 반드시 그린다. (prompts.py `_CROSS_PV1C`)
#
# 통제: 모델·설정·SKU·레퍼런스 전부 고정, **pv만** 다르다 (07 §4 축별 독립 1:1).
#   pv1은 동결이므로 수정이 아니라 새 키 pv1c 추가 — 그리고 pv1c는 cross 지시 한 문단만
#   다르다(shoulder·back·neck 지시와 템플릿 본문은 pv1과 바이트 단위로 동일함을 검증했다).
#
# 셀카 2종의 역할이 다르다:
#   s_casual  = **실패 조건** (정면·직립·팔 내림, 팔–몸통 틈 있음). 개선을 재는 셀.
#   s_smart   = **회귀 감시 대조군** (팔짱 → 틈 없음). R2에서 cross 2/2 pass.
#               pv1c가 여기서 무너지면 "틈 없는 자세"를 망가뜨린 것이므로 채택 불가.
#
# reps=4인 이유: s_casual의 현행 통과율이 1/8(12.5%)이다. N2로는 0/2 vs 1/2 같은 결과가
#   나와 개선인지 잡음인지 가릴 수 없다. 팔당 4장이 최소선이다.

# ── 성공 판정선 (실행 전 확정 — 결과를 보고 고치지 않는다) ──────────────────────
#   층 1 (갤러리, 개정 c3 기준):
#     채택 = s_casual에서 pv1c의 **c3 pass ≥ 2/4**  AND  s_smart에서 **회귀 없음**(pv1 이상)
#     기각 = s_casual c3 pass ≤ 1/4  또는  s_smart에서 pv1보다 낮음
#   층 2 (강제 선택 8쌍, `--axis pv --baseline pv1`):
#     참고 지표로만 쓴다. c3는 이진 판정이라 층 1이 주 지표다.
#   판정 불가 시 기본값 = **pv1 유지** (A-5 타이브레이커 ③과 같은 정신)

exp_id: r3f_cross
models: [gpt_base]               # R5 이관 확정 설정 (mid · 1152x1536 · ref 2장) — §A-7 ①
selfies: [s_casual, s_smart]
products: [MMRGATA04CO001]
prompt_versions: [pv1, pv1c]
reps: 4
concurrency: { global: 2, per_model: 2 }   # gpt 동시 2 = R2·S4a와 같은 부하.
                                           #   모델 엔트리가 1개뿐이라 per_model도 2로 올려야
                                           #   실효 동시성이 2가 된다 (S4a는 3엔트리 × 1이었다)
budget_cap_usd: 1.5                        # 견적 1.28 바로 위
timeout_s: 90                              # 측정을 우리 컷오프로 절단하지 않는다
